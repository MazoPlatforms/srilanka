name: Deploy maintained Sri Lanka map UI

on:
  push:
    branches: [main]
    paths:
      - public/index.html
      - .github/workflows/deploy-map-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sri-lanka-pages-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Validate site files
        run: |
          test -s public/index.html
          test -s public/data/districts.json
          test -s public/vendor/maplibre-gl.js
          test -s public/vendor/pmtiles.js
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
