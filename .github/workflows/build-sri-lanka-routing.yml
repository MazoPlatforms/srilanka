name: Build Sri Lanka routing data

# One-time run. Downloads Overture road segments, builds a routing graph as JSON
# cells in public/data/routing/<001>/<001>/<cell>.json (max 999 files per folder,
# extra nesting levels are added automatically so there is no overall limit),
# adds a Directions panel to public/index.html and commits everything to main.
on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy GitHub Pages afterwards"
        type: boolean
        default: true
      overturemaps_version:
        description: "Pin overturemaps pip version (blank = latest)"
        default: ""

concurrency:
  group: sri-lanka-routing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install overturemaps CLI
        env:
          PIN: ${{ inputs.overturemaps_version }}
        run: |
          if [ -n "$PIN" ]; then pip install "overturemaps==$PIN"; else pip install -U overturemaps; fi

      - name: Write scripts
        run: |
          mkdir -p build
          cat > build/route_builder.py <<'PYEOF'
          import bisect, json, math, os, shutil, subprocess, sys, time

          W0, S0, E0, N0 = 79.4, 5.8, 82.0, 9.95
          CELL, PER = 0.05, 999
          NX, NY = int((E0 - W0) / CELL) + 2, int((N0 - S0) / CELL) + 2
          OUT = "public/data/routing"
          CLASSES = ["motorway", "trunk", "primary", "secondary", "tertiary", "residential",
                     "living_street", "unclassified", "service", "pedestrian", "footway", "steps",
                     "path", "cycleway", "bridleway", "track", "ferry", "unknown"]
          CI = {c: i for i, c in enumerate(CLASSES)}
          # mode bits: 1 car, 2 motorcycle, 4 truck, 8 bus, 16 bicycle, 32 foot, 64 wheelchair
          BASE = {"motorway": 15, "pedestrian": 112, "footway": 96, "steps": 32, "path": 48,
                  "cycleway": 48, "bridleway": 48, "track": 51}
          MB = {"vehicle": 31, "motor_vehicle": 15, "car": 1, "motorcar": 1, "motorcycle": 2,
                "truck": 4, "hgv": 4, "bus": 8, "bicycle": 16, "foot": 96}

          def hav(a, b):
              p1, p2 = math.radians(a[1]), math.radians(b[1])
              h = math.sin((p2 - p1) / 2) ** 2 + math.cos(p1) * math.cos(p2) * math.sin(math.radians(b[0] - a[0]) / 2) ** 2
              return 12742017.6 * math.asin(math.sqrt(h))

          def at_d(line, cum, d):
              if d <= 0:
                  return list(line[0][:2])
              if d >= cum[-1]:
                  return list(line[-1][:2])
              i = bisect.bisect_right(cum, d)
              seg = cum[i] - cum[i - 1]
              t = (d - cum[i - 1]) / seg if seg else 0
              a, b = line[i - 1], line[i]
              return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]

          def cell_of(c):
              x = min(NX - 1, max(0, int(math.floor((c[0] - W0) / CELL))))
              y = min(NY - 1, max(0, int(math.floor((c[1] - S0) / CELL))))
              return y * NX + x

          def cell_path(n, depth):
              leaf, segs = n // PER, []
              for _ in range(depth):
                  segs.append("%03d" % (leaf % PER + 1))
                  leaf //= PER
              return "/".join(reversed(segs))

          def stream():
              cmd = ["overturemaps", "download", "--bbox=%s,%s,%s,%s" % (W0, S0, E0, N0),
                     "-f", "geojsonseq", "--type=segment"]
              p = subprocess.Popen(cmd, stdout=subprocess.PIPE, text=True, encoding="utf-8", bufsize=1 << 20)
              for line in p.stdout:
                  line = line.strip().lstrip("\x1e")
                  if line:
                      yield json.loads(line)
              if p.wait() != 0:
                  sys.exit("overturemaps download failed")

          def jl(v):
              if isinstance(v, str):
                  try:
                      return json.loads(v)
                  except ValueError:
                      return None
              return v

          nid, coords, cells = {}, [], {}

          def node(key, pt):
              i = nid.get(key)
              if i is None:
                  i = nid[key] = len(coords)
                  coords.append([round(pt[0], 6), round(pt[1], 6)])
              return i

          def access(p, mask):
              fw = bw = mask
              for r in jl(p.get("access_restrictions")) or []:
                  if not isinstance(r, dict) or r.get("access_type") != "denied":
                      continue
                  w = r.get("when") or {}
                  if w.get("during") or w.get("using") or w.get("recognized") or w.get("vehicle"):
                      continue
                  modes = w.get("mode")
                  m = 127
                  if modes:
                      m = 0
                      for x in modes:
                          m |= MB.get(x, 0)
                  if not m:
                      continue
                  h = w.get("heading")
                  if h != "backward":
                      fw &= ~m
                  if h != "forward":
                      bw &= ~m
              return fw, bw

          def speed_limit(p):
              for s in jl(p.get("speed_limits")) or []:
                  if not isinstance(s, dict) or s.get("when"):
                      continue
                  mx = s.get("max_speed") or {}
                  v = mx.get("value")
                  if isinstance(v, (int, float)) and v > 0:
                      return int(round(v * 1.609 if mx.get("unit") == "mph" else v))
              return 0

          def main():
              t0, nseg = time.time(), 0
              shutil.rmtree(OUT, ignore_errors=True)
              os.makedirs(OUT)
              for f in stream():
                  g, p = f.get("geometry") or {}, f.get("properties") or {}
                  if g.get("type") != "LineString" or p.get("subtype") == "rail":
                      continue
                  cls = "ferry" if p.get("subtype") == "water" else (p.get("class") or "unknown")
                  if cls not in CI:
                      cls = "unknown"
                  conns = jl(p.get("connectors"))
                  if not isinstance(conns, list):
                      continue
                  cs = sorted((c.get("at") or 0, c["connector_id"]) for c in conns
                              if isinstance(c, dict) and c.get("connector_id"))
                  if len(cs) < 2:
                      continue
                  line = g["coordinates"]
                  cum = [0.0]
                  for i in range(1, len(line)):
                      cum.append(cum[-1] + hav(line[i - 1], line[i]))
                  total = cum[-1]
                  if total <= 0:
                      continue
                  fw, bw = access(p, BASE.get(cls, 127))
                  if not (fw or bw):
                      continue
                  spd = speed_limit(p)
                  nseg += 1
                  for k in range(len(cs) - 1):
                      (t0_, i0), (t1_, i1) = cs[k], cs[k + 1]
                      if i0 == i1 or t1_ <= t0_:
                          continue
                      d0, d1 = t0_ * total, t1_ * total
                      pa, pb = at_d(line, cum, d0), at_d(line, cum, d1)
                      a, b = node(i0, pa), node(i1, pb)
                      if a == b:
                          continue
                      geom = []
                      for j in range(len(line)):
                          if d0 < cum[j] < d1:
                              geom += [round(line[j][0], 5), round(line[j][1], 5)]
                      e = [a, b, max(1, int(round(d1 - d0))), CI[cls], spd, fw, bw, geom or 0]
                      ca, cb = cell_of(coords[a]), cell_of(coords[b])
                      cells.setdefault(ca, []).append(e)
                      if cb != ca:
                          cells.setdefault(cb, []).append(e)
              if not cells:
                  sys.exit("No road segments downloaded")
              depth = 2
              while max(cells) // PER >= PER ** depth:
                  depth += 1
              edges = 0
              for n, es in cells.items():
                  ns = {}
                  for e in es:
                      ns[e[0]] = coords[e[0]]
                      ns[e[1]] = coords[e[1]]
                  d = os.path.join(OUT, cell_path(n, depth))
                  os.makedirs(d, exist_ok=True)
                  with open(os.path.join(d, "%d.json" % n), "w") as fo:
                      json.dump({"n": ns, "e": es}, fo, separators=(",", ":"))
                  edges += len(es)
              with open(OUT + "/manifest.json", "w") as fo:
                  json.dump({"schema": 1, "w": W0, "s": S0, "cell": CELL, "nx": NX, "ny": NY,
                             "per": PER, "depth": depth, "classes": CLASSES,
                             "modes": {"car": 1, "motorcycle": 2, "truck": 4, "bus": 8,
                                       "bike": 16, "walk": 32, "wheelchair": 64},
                             "segments": nseg, "nodes": len(coords), "edges": edges, "cells": len(cells),
                             "built": time.strftime("%Y-%m-%d", time.gmtime())}, fo)
              print("segments %d nodes %d edges %d cells %d depth %d in %ds" %
                    (nseg, len(coords), edges, len(cells), depth, time.time() - t0))

          main()
          PYEOF

          cat > build/routing.js <<'JSEOF'
          (function () {
            const R = "data/routing/";
            const MODES = { car: { b: 1, max: 33 }, motorcycle: { b: 2, max: 30 }, truck: { b: 4, max: 25 },
              bus: { b: 8, max: 25 }, bike: { b: 16, max: 8 }, walk: { b: 32, max: 1.6 }, wheelchair: { b: 64, max: 1.2 } };
            const CS = { motorway: 27, trunk: 20, primary: 16, secondary: 13, tertiary: 11, residential: 8,
              living_street: 5, unclassified: 9, service: 5, track: 4, unknown: 8 };
            let M, map, mode = "car", pick = null, pts = { s: null, t: null }, marks = {};
            const cache = new Map(), nodes = new Map(), adj = new Map(), cellNodes = new Map(), loaded = new Set();

            const cellOf = (lon, lat) => {
              const x = Math.min(M.nx - 1, Math.max(0, Math.floor((lon - M.w) / M.cell)));
              const y = Math.min(M.ny - 1, Math.max(0, Math.floor((lat - M.s) / M.cell)));
              return y * M.nx + x;
            };
            const path = n => {
              let l = Math.floor(n / M.per), s = [];
              for (let i = 0; i < M.depth; i++) { s.push(String(l % M.per + 1).padStart(3, "0")); l = Math.floor(l / M.per); }
              return R + s.reverse().join("/") + "/" + n + ".json";
            };
            const dist = (a, b) => { const k = Math.cos((a[1] + b[1]) * Math.PI / 360);
              return 111320 * Math.hypot((a[0] - b[0]) * k, a[1] - b[1]); };

            function load(n) {
              if (!cache.has(n)) cache.set(n, fetch(path(n)).then(r => r.ok ? r.json() : { n: {}, e: [] })
                .catch(() => ({ n: {}, e: [] })).then(d => {
                  for (const k in d.n) nodes.set(+k, d.n[k]);
                  const ids = [];
                  for (const e of d.e) for (const dir of [0, 1]) {
                    const id = e[dir], c = nodes.get(id);
                    if (cellOf(c[0], c[1]) !== n) continue;
                    let a = adj.get(id);
                    if (!a) { adj.set(id, a = []); ids.push(id); }
                    a.push([e, dir]);
                  }
                  cellNodes.set(n, ids); loaded.add(n);
                }));
              return cache.get(n);
            }
            async function snap(m, lng, lat) {
              const c = cellOf(lng, lat), cx = c % M.nx, cy = Math.floor(c / M.nx), cs = [];
              for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
                const x = cx + dx, y = cy + dy;
                if (x >= 0 && y >= 0 && x < M.nx && y < M.ny) cs.push(y * M.nx + x);
              }
              await Promise.all(cs.map(load));
              const b = MODES[m].b, k = Math.cos(lat * Math.PI / 180);
              let best = null, bd = 1e18;
              for (const cc of cs) for (const id of cellNodes.get(cc) || []) {
                if (!adj.get(id).some(([e, d]) => e[5 + d] & b)) continue;
                const p = nodes.get(id), d2 = ((p[0] - lng) * k) ** 2 + (p[1] - lat) ** 2;
                if (d2 < bd) { bd = d2; best = id; }
              }
              return best;
            }
            function speed(m, e) {
              const c = M.classes[e[3]];
              if (c === "ferry") return Math.min(5, MODES[m].max);
              if (m === "walk") return c === "steps" ? 0.8 : 1.4;
              if (m === "wheelchair") return 1.1;
              if (m === "bike") return c === "path" || c === "track" ? 3 : 4.2;
              const v = e[4] > 0 ? e[4] / 3.6 * 0.85 : (CS[c] || 8);
              return Math.max(1, Math.min(v * (m === "car" || m === "motorcycle" ? 1 : 0.85), MODES[m].max));
            }
            class Heap {
              constructor() { this.a = []; }
              get n() { return this.a.length; }
              push(k, v) { const a = this.a; a.push([k, v]); let i = a.length - 1;
                while (i > 0) { const p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; [a[p], a[i]] = [a[i], a[p]]; i = p; } }
              pop() { const a = this.a, top = a[0], last = a.pop();
                if (a.length) { a[0] = last; let i = 0;
                  for (;;) { let l = 2 * i + 1, r = l + 1, s = i;
                    if (l < a.length && a[l][0] < a[s][0]) s = l;
                    if (r < a.length && a[r][0] < a[s][0]) s = r;
                    if (s === i) break; [a[s], a[i]] = [a[i], a[s]]; i = s; } }
                return top; }
            }
            async function route(m, s, t) {
              const b = MODES[m].b, mx = MODES[m].max, T = nodes.get(t);
              const h = id => dist(nodes.get(id), T) / mx;
              const g = new Map([[s, 0]]), prev = new Map(), done = new Set(), H = new Heap();
              H.push(h(s), s);
              let it = 0;
              while (H.n) {
                const u = H.pop()[1];
                if (done.has(u)) continue;
                if (u === t) break;
                done.add(u);
                const p = nodes.get(u), c = cellOf(p[0], p[1]);
                if (!loaded.has(c)) await load(c);
                for (const [e, d] of adj.get(u) || []) {
                  if (!(e[5 + d] & b)) continue;
                  const v = e[1 - d], nd = g.get(u) + e[2] / speed(m, e);
                  if (nd < (g.get(v) ?? 1e18)) { g.set(v, nd); prev.set(v, [u, e, d]); H.push(nd + h(v), v); }
                }
                if (++it > 4e6) break;
              }
              if (!prev.has(t) && s !== t) return null;
              const steps = []; let v = t, len = 0;
              while (v !== s) {
                const [u, e, d] = prev.get(v), mid = [];
                for (let i = 0; e[7] && i < e[7].length; i += 2) mid.push([e[7][i], e[7][i + 1]]);
                if (d) mid.reverse();
                steps.push([nodes.get(u), ...mid]); len += e[2]; v = u;
              }
              return { line: steps.reverse().flat().concat([nodes.get(t)]), len, time: g.get(t) || 0 };
            }

            const $ = id => document.getElementById(id);
            const fmt = s => s >= 3600 ? Math.floor(s / 3600) + " h " + Math.round(s % 3600 / 60) + " min" : Math.max(1, Math.round(s / 60)) + " min";
            function setPoint(k, ll) {
              pts[k] = [ll.lng, ll.lat];
              if (marks[k]) marks[k].remove();
              marks[k] = new maplibregl.Marker({ color: k === "s" ? "#2e9e5b" : "#e5484d" }).setLngLat(pts[k]).addTo(map);
            }
            async function go() {
              if (!pts.s || !pts.t) return;
              $("rinfo").textContent = "Finding route…";
              try {
                const s = await snap(mode, ...pts.s), t = await snap(mode, ...pts.t);
                if (s == null || t == null) { $("rinfo").textContent = "No " + mode + " road near a point."; return draw([]); }
                const r = await route(mode, s, t);
                if (!r) { $("rinfo").textContent = "No route found for this mode."; return draw([]); }
                draw(r.line);
                $("rinfo").textContent = (r.len / 1000).toFixed(1) + " km · " + fmt(r.time);
                const b = new maplibregl.LngLatBounds();
                r.line.forEach(p => b.extend(p));
                map.fitBounds(b, { padding: 60, maxZoom: 16 });
              } catch (err) { console.error(err); $("rinfo").textContent = "Routing failed."; }
            }
            function draw(line) {
              map.getSource("route").setData({ type: "Feature", geometry: { type: "LineString", coordinates: line }, properties: {} });
            }
            function ui() {
              const box = document.createElement("div");
              box.className = "panel";
              box.style.cssText = "top:auto;bottom:64px;left:10px";
              box.innerHTML = '<details><summary>Directions</summary>' +
                '<select id="rmode" style="width:100%;margin:6px 0;padding:6px;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:6px">' +
                '<option value="car">Car</option><option value="motorcycle">Motorcycle</option><option value="bike">Bicycle</option>' +
                '<option value="walk">Walking</option><option value="truck">Truck</option><option value="bus">Bus</option>' +
                '<option value="wheelchair">Wheelchair</option></select>' +
                '<div style="display:flex;gap:6px"><button id="rs" type="button">Start</button><button id="rt" type="button">End</button>' +
                '<button id="rc" type="button">Clear</button></div></details><small id="rinfo">Tap Start, then tap the map.</small>';
              document.body.appendChild(box);
              $("rmode").onchange = e => { mode = e.target.value; go(); };
              $("rs").onclick = () => { pick = "s"; $("rinfo").textContent = "Tap the start point on the map."; };
              $("rt").onclick = () => { pick = "t"; $("rinfo").textContent = "Tap the end point on the map."; };
              $("rc").onclick = () => { pts = { s: null, t: null }; for (const k in marks) marks[k].remove(); marks = {}; draw([]); $("rinfo").textContent = "Tap Start, then tap the map."; };
              map.on("click", e => {
                if (!pick) return;
                setPoint(pick, e.lngLat);
                const next = pick === "s" && !pts.t ? "t" : null;
                pick = next;
                if (next) $("rinfo").textContent = "Now tap the end point."; else go();
              });
            }
            function start() {
              map = window.__map;
              const init = () => {
                map.addSource("route", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
                map.addLayer({ id: "route-line", type: "line", source: "route",
                  layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#e5484d", "line-width": 5, "line-opacity": 0.9 } });
                ui();
              };
              map.loaded() || map.isStyleLoaded() ? init() : map.once("load", init);
            }
            fetch(R + "manifest.json").then(r => r.json()).then(m => {
              M = m;
              const t = setInterval(() => { if (window.__map) { clearInterval(t); start(); } }, 200);
            }).catch(() => {});
          })();
          JSEOF

          cat > build/patch_index.py <<'PYEOF'
          import sys
          p = "public/index.html"
          h = open(p, encoding="utf-8").read()
          hook = 'map.addControl(new maplibregl.ScaleControl(), "bottom-left");'
          if "window.__map" not in h:
              if hook not in h:
                  sys.exit("index.html hook not found")
              h = h.replace(hook, hook + " window.__map = map;")
          if 'src="routing.js"' not in h:
              h = h.replace("</body>", '<script src="routing.js"></script>\n</body>')
          open(p, "w", encoding="utf-8").write(h)
          PYEOF

      - name: Build routing graph
        run: python build/route_builder.py

      - name: Add routing to the website
        run: |
          test -f public/index.html || { echo "::error::public/index.html missing on main"; exit 1; }
          cp build/routing.js public/routing.js
          python build/patch_index.py

      - name: Check limits
        run: |
          echo "Routing: $(du -sm public/data/routing | cut -f1) MB, $(find public/data/routing -type f | wc -l) files"
          echo "Site: $(du -sm public | cut -f1) MB"
          if find public -type f -size +99M | grep -q .; then echo "::error::File over 100 MB"; exit 1; fi
          [ "$(du -sm public | cut -f1)" -le 950 ] || echo "::warning::Site nearing the 1 GB Pages limit"

      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add -A public
          git commit -q -m "Add routing data and Directions panel" || echo "Nothing to commit"
          git push -q origin HEAD:main

      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.deploy_pages || inputs.deploy_pages == null }}
        with:
          path: public

  deploy:
    needs: build
    if: ${{ inputs.deploy_pages || inputs.deploy_pages == null }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
