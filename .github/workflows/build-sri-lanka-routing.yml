name: Build Sri Lanka routing graphs (one-time)

# Maintains editable nationwide OSM road records in /public/roads/AAA/BBB/<id>.json
# (and site/roads for Pages). Compiled navigation graphs remain under /routing.
# Directory names are deterministic ID buckets (001..999), not districts.
# Client: routing/router.js (A* in the browser, no server).
on:
  workflow_dispatch:
    inputs:
      pbf_url:
        default: "https://download.geofabrik.de/asia/sri-lanka-latest.osm.pbf"
      reexport:
        description: "Re-create public/roads/ from OSM (OVERWRITES manually edited road JSON)"
        type: boolean
        default: false
      deploy_pages:
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          path: src
      - run: pip install osmium numpy

      - name: Cache OSM extract (download once)
        id: pbf
        uses: actions/cache@v4
        with:
          path: sl.osm.pbf
          key: sl-osm-pbf-${{ inputs.pbf_url }}
      - name: Download
        if: steps.pbf.outputs.cache-hit != 'true'
        run: curl -fL --retry 3 -o sl.osm.pbf "${{ inputs.pbf_url }}"

      - name: Clone site branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch site "$URL" site || { git clone --depth 1 "$URL" site && cd site && git checkout --orphan site && git rm -rf . -q; }
          mkdir -p site/routing

      - name: Build graphs
        run: |
          cat > build.py <<'PYEOF'
          import osmium, numpy as np, os, json, math, glob
          from array import array
          EXPORT = os.environ["EXPORT"] == "1"; ROUTES = os.environ["ROUTES"]
          R = {"motorway":90,"motorway_link":50,"trunk":70,"trunk_link":45,"primary":55,"primary_link":40,
               "secondary":45,"secondary_link":35,"tertiary":40,"tertiary_link":30,"unclassified":30,
               "residential":25,"living_street":10,"service":15,"track":15}
          def sub(d, drop=(), cap=None):
              return {k: (min(v, cap) if cap else v) for k, v in d.items() if k not in drop}
          MODES = {
            "car": sub(R, ("track",)),
            "motorcycle": sub(R, ("track",), 60),
            "truck": sub(R, ("track","service","living_street"), 50),
            "bicycle": {**sub(R, ("motorway","motorway_link","trunk","trunk_link"), 20), "cycleway":18, "path":12, "pedestrian":10, "footway":8},
            "foot": {**sub(R, ("motorway","motorway_link"), 5), "footway":5, "path":4, "pedestrian":5, "steps":2, "cycleway":5, "track":4},
          }
          def hav(a, b):
              dx = math.radians(b[0]-a[0]) * math.cos(math.radians((a[1]+b[1])/2)); dy = math.radians(b[1]-a[1])
              return 6371000 * math.hypot(dx, dy)

          # ---------- 1) export: one editable JSON file per OSM road/path ----------
          class H(osmium.SimpleHandler):
              n = 0
              def way(self, w):
                  t = w.tags; hw = t.get("highway")
                  if not hw: return
                  if t.get("access") in ("no", "private") and t.get("foot") not in ("yes","designated"): return
                  try: co = [[round(n.lon, 6), round(n.lat, 6)] for n in w.nodes]
                  except Exception: return
                  ms = None
                  try: ms = float(str(t.get("maxspeed", "")).split()[0])
                  except Exception: pass
                  sp = {}
                  for m, tab in MODES.items():
                      v = tab.get(hw)
                      if m == "bicycle" and t.get("bicycle") == "no": v = None
                      if m == "foot" and t.get("foot") == "no": v = None
                      if m in ("car","motorcycle","truck") and t.get("motor_vehicle") == "no": v = None
                      if not v: continue
                      if ms and m in ("car","motorcycle","truck"): v = min(ms, v + 20)
                      sp[m] = v
                  if not sp or len(co) < 2: return
                  ow = t.get("oneway"); rb = t.get("junction") in ("roundabout", "circular")
                  o = "forward" if (ow in ("yes","true","1") or rb) else ("reverse" if ow == "-1" else False)
                  d = {"id": w.id, "name": t.get("name", ""), "highway": hw, "oneway": o, "deleted": False,
                       "speeds_kmh": sp, "coordinates": co}
                  # Two deterministic 001..999 directories; no district-based splitting.
                  # Existing IDs always resolve to the same path on a later import.
                  first = (w.id // 999) % 999 + 1
                  second = w.id % 999 + 1
                  dest = f"{ROUTES}/{first:03d}/{second:03d}"
                  os.makedirs(dest, exist_ok=True)
                  with open(f"{dest}/{w.id}.json", "w", encoding="utf-8") as f:
                      f.write("{\n" + ",\n".join(f'  "{k}": {json.dumps(v, ensure_ascii=False)}' for k, v in d.items()) + "\n}\n")
                  H.n += 1

          if EXPORT:
              os.makedirs(ROUTES, exist_ok=True)
              H().apply_file("sl.osm.pbf", locations=True)
              print("exported", H.n, "routes")

          # ---------- 2) build graphs from the route files (+ custom-routes) ----------
          K = {}; LON = array("i"); LAT = array("i")
          B = {m: [array("q"), array("q"), array("f")] for m in MODES}; VM = {m: 1.0 for m in MODES}
          def node(p):
              lo, la = round(p[0] * 1e6), round(p[1] * 1e6); k = lo * 33554432 + la
              i = K.get(k)
              if i is None: i = K[k] = len(LON); LON.append(lo); LAT.append(la)
              return i
          snap = None
          def near(p):
              k = math.cos(math.radians(p[1]))
              d = np.hypot((snap[0] - p[0] * 1e6) * k, snap[1] - p[1] * 1e6) * 0.11132
              i = int(d.argmin()); return i if d[i] <= 25 else None
          def load(files, custom):
              global snap
              if custom: snap = (np.frombuffer(LON, np.int32).copy(), np.frombuffer(LAT, np.int32).copy())
              for fn in files:
                  r = json.load(open(fn, encoding="utf-8"))
                  if r.get("deleted"): continue
                  sp = r.get("speeds_kmh") or {m: float(r.get("speed_kmh", 30)) for m in (r.get("modes") or MODES)}
                  ow = r.get("oneway", False); ow = "forward" if ow is True else ow
                  co = r["coordinates"]; ids = [node(p) for p in co]
                  if custom and r.get("snap", True):
                      for j in (0, -1):
                          x = near(co[j])
                          if x is not None: ids[j] = x
                  for m, v in sp.items():
                      if m not in MODES or not v or v <= 0: continue
                      VM[m] = max(VM[m], v)
                      f, b = True, True
                      if m != "foot":
                          if ow == "forward": b = False
                          elif ow == "reverse": f = False
                      U, V, C = B[m]
                      for a, c2 in zip(ids, ids[1:]):
                          c = hav((LON[a]/1e6, LAT[a]/1e6), (LON[c2]/1e6, LAT[c2]/1e6)) / (v / 3.6)
                          if f: U.append(a); V.append(c2); C.append(c)
                          if b: U.append(c2); V.append(a); C.append(c)
          load(glob.iglob(f"{ROUTES}/[0-9][0-9][0-9]/[0-9][0-9][0-9]/*.json"), False)
          cf = sorted(glob.glob("src/custom-routes/*.json")); load(cf, True); print("custom files", len(cf))
          LL = np.stack([np.frombuffer(LON, np.int32), np.frombuffer(LAT, np.int32)], 1)
          for m in MODES:
              U, V, C = (np.frombuffer(a, dt) for a, dt in zip(B[m], ("i8","i8","f4")))
              refs, inv = np.unique(np.concatenate([U, V]), return_inverse=True)
              u, v = inv[:len(U)].astype(np.uint32), inv[len(U):].astype(np.uint32)
              o = np.argsort(u, kind="stable"); u, v, c = u[o], v[o], C[o].astype(np.float32)
              N = len(refs); offs = np.zeros(N + 1, np.uint32); np.cumsum(np.bincount(u, minlength=N), out=offs[1:])
              d = f"site/routing/{m}"; os.makedirs(d, exist_ok=True)
              for n, arr in (("coords", LL[refs].astype(np.int32).ravel()), ("offsets", offs), ("targets", v), ("costs", c)):
                  arr.tofile(f"{d}/{n}.bin")
              json.dump({"mode": m, "nodes": N, "edges": len(v), "vmax_ms": VM[m] / 3.6,
                         "units": "coords=int32 lon/lat*1e6; costs=float32 seconds"}, open(f"{d}/meta.json", "w"), indent=2)
              print(m, N, len(v))
          PYEOF
          if [ -d src/public/roads ] && find src/public/roads -name "*.json" -print -quit | grep -q . && [ "${{ inputs.reexport }}" != "true" ]; then
            export EXPORT=0 ROUTES=src/public/roads
          else
            export EXPORT=1 ROUTES=roads_out
          fi
          echo "EXPORT=$EXPORT ROUTES=$ROUTES"
          python build.py
          if [ "$EXPORT" = "1" ]; then
            rm -rf site/roads
            mkdir -p site/roads
            cp -a roads_out/. site/roads/
          elif [ ! -d site/roads ]; then
            mkdir -p site/roads
            cp -a src/public/roads/. site/roads/
          fi
          cat > site/routing/router.js <<'JSEOF'
          // Static A* router. Usage:
          //   const r = await SLRouter.load("routing/car/");   // car|motorcycle|truck|bicycle|foot (folder; meta.json is editable)
          //   const res = r.route([lon1, lat1], [lon2, lat2]);    // {coords:[[lon,lat]..], meters, seconds} | null
          //   map.getSource("route").setData({type:"Feature",geometry:{type:"LineString",coordinates:res.coords}});
          const SLRouter = (() => {
            const hav = (a, b, c, d) => { const x = (c - a) * Math.PI / 180 * Math.cos((b + d) * Math.PI / 360), y = (d - b) * Math.PI / 180; return 6371000 * Math.hypot(x, y); };
            class R {
              constructor(meta, ll, offs, dst, cost) {
                Object.assign(this, { N: meta.nodes, E: meta.edges, vmax: meta.vmax_ms, ll, offs, dst, cost });
              }
              snap(lon, lat) {
                let best = -1, bd = 1e18; const ll = this.ll, k = Math.cos(lat * Math.PI / 180);
                for (let i = 0; i < this.N; i++) {
                  const dx = (ll[2 * i] / 1e6 - lon) * k, dy = ll[2 * i + 1] / 1e6 - lat, d = dx * dx + dy * dy;
                  if (d < bd) { bd = d; best = i; }
                }
                return best;
              }
              route(a, b) {
                const s = this.snap(a[0], a[1]), t = this.snap(b[0], b[1]); if (s < 0 || t < 0) return null;
                const ll = this.ll, tx = ll[2 * t] / 1e6, ty = ll[2 * t + 1] / 1e6, vm = this.vmax;
                const g = new Map([[s, 0]]), prev = new Map(), done = new Set();
                const hp = [[0, s]]; // binary min-heap of [f, node]
                const push = x => { hp.push(x); let i = hp.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (hp[p][0] <= hp[i][0]) break; [hp[p], hp[i]] = [hp[i], hp[p]]; i = p; } };
                const pop = () => { const top = hp[0], last = hp.pop(); if (hp.length) { hp[0] = last; let i = 0; for (;;) { let l = 2 * i + 1, r = l + 1, m = i; if (l < hp.length && hp[l][0] < hp[m][0]) m = l; if (r < hp.length && hp[r][0] < hp[m][0]) m = r; if (m === i) break; [hp[m], hp[i]] = [hp[i], hp[m]]; i = m; } } return top; };
                while (hp.length) {
                  const [, u] = pop(); if (done.has(u)) continue; done.add(u);
                  if (u === t) break;
                  const gu = g.get(u);
                  for (let e = this.offs[u]; e < this.offs[u + 1]; e++) {
                    const v = this.dst[e], gv = gu + this.cost[e];
                    if (gv < (g.get(v) ?? Infinity)) {
                      g.set(v, gv); prev.set(v, u);
                      push([gv + hav(ll[2 * v] / 1e6, ll[2 * v + 1] / 1e6, tx, ty) / vm, v]);
                    }
                  }
                }
                if (!done.has(t)) return null;
                const coords = []; let m = 0;
                for (let n = t; n !== undefined; n = prev.get(n)) coords.push([ll[2 * n] / 1e6, ll[2 * n + 1] / 1e6]);
                coords.reverse();
                for (let i = 1; i < coords.length; i++) m += hav(...coords[i - 1], ...coords[i]);
                return { coords, meters: m, seconds: g.get(t) };
              }
            }
            const buf = async u => (await fetch(u)).arrayBuffer();
            return { load: async dir => { const meta = await (await fetch(dir + "meta.json")).json();
              const [c, o, t, w] = await Promise.all(["coords", "offsets", "targets", "costs"].map(n => buf(dir + n + ".bin")));
              return new R(meta, new Int32Array(c), new Uint32Array(o), new Uint32Array(t), new Float32Array(w)); } };
          })();
          JSEOF
          # strip heredoc indentation
          sed -i 's/^          //' site/routing/router.js
          du -sh site/routing/*

      - name: Check limits
        run: |
          find site/routing site/roads -type f -size +95M -print | grep . && { echo "::error::file >95 MB"; exit 1; } || true

      - name: Save to site branch
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A && git commit -q -m "Routing graphs" || echo "Nothing to commit"
          git push -q origin HEAD:site

      - name: Save to main (/public/routing and /public/roads)
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git clone --depth 1 --branch "$MAIN_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mainrepo
          mkdir -p mainrepo/public && rm -rf mainrepo/public/routing
          cp -r site/routing mainrepo/public/routing
          if [ -d roads_out ]; then
            rm -rf mainrepo/public/roads
            mkdir -p mainrepo/public/roads
            cp -a roads_out/. mainrepo/public/roads/
          fi
          cd mainrepo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add -A && git commit -q -m "Routing graphs" || echo "Nothing to commit"
          git push -q origin "HEAD:${MAIN_BRANCH}"

      - name: Prepare Pages artifact
        if: ${{ inputs.deploy_pages }}
        run: rsync -a --exclude .git site/ pages/
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.deploy_pages }}
        with:
          path: pages

  deploy:
    needs: build
    if: ${{ inputs.deploy_pages }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
