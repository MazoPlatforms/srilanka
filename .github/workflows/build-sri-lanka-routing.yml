name: Build Sri Lanka routing graphs (one-time)

# Downloads the Sri Lanka OSM extract ONCE (cached), builds compact static routing graphs
# for car, motorcycle, truck, bicycle and foot, and stores them under /routing in the
# `site` branch, GitHub Pages and main (/public/routing) - same layout as the places data.
# Client: routing/router.js (A* in the browser, no server).
on:
  workflow_dispatch:
    inputs:
      pbf_url:
        default: "https://download.geofabrik.de/asia/sri-lanka-latest.osm.pbf"
      deploy_pages:
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install osmium numpy

      - name: Cache OSM extract (download once)
        id: pbf
        uses: actions/cache@v4
        with:
          path: sl.osm.pbf
          key: sl-osm-pbf-${{ inputs.pbf_url }}
      - name: Download
        if: steps.pbf.outputs.cache-hit != 'true'
        run: curl -fL --retry 3 -o sl.osm.pbf "${{ inputs.pbf_url }}"

      - name: Clone site branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch site "$URL" site || { git clone --depth 1 "$URL" site && cd site && git checkout --orphan site && git rm -rf . -q; }
          mkdir -p site/routing

      - name: Build graphs
        run: |
          cat > build.py <<'PYEOF'
          import osmium, numpy as np, struct, math
          from array import array

          # mode: (speeds km/h by highway, oneway?, vmax km/h)
          R = {"motorway":90,"motorway_link":50,"trunk":70,"trunk_link":45,"primary":55,"primary_link":40,
               "secondary":45,"secondary_link":35,"tertiary":40,"tertiary_link":30,"unclassified":30,
               "residential":25,"living_street":10,"service":15,"track":15}
          def sub(d, drop=(), cap=None):
              return {k: (min(v, cap) if cap else v) for k, v in d.items() if k not in drop}
          MODES = {
            "car":        (sub(R, ("track",)), True),
            "motorcycle": (sub(R, ("track",), 60), True),
            "truck":      (sub(R, ("track","service","living_street"), 50), True),
            "bicycle":    ({**sub(R, ("motorway","motorway_link","trunk","trunk_link"), 20),
                            "cycleway":18, "path":12, "pedestrian":10, "footway":8}, True),
            "foot":       ({**sub(R, ("motorway","motorway_link"), 5), "footway":5, "path":4,
                            "pedestrian":5, "steps":2, "cycleway":5, "track":4}, False),
          }
          B = {m: [array("q"), array("q"), array("f")] for m in MODES}
          XY = {}

          def hav(a, b):
              dx = math.radians(b[0]-a[0]) * math.cos(math.radians((a[1]+b[1])/2)); dy = math.radians(b[1]-a[1])
              return 6371000 * math.hypot(dx, dy)

          class H(osmium.SimpleHandler):
              def way(self, w):
                  t = w.tags; hw = t.get("highway")
                  if not hw: return
                  if t.get("access") in ("no", "private") and t.get("foot") not in ("yes","designated"): return
                  try:
                      pts = [(n.ref, (n.lon, n.lat)) for n in w.nodes]
                  except Exception:
                      return
                  ow = t.get("oneway"); rb = t.get("junction") in ("roundabout", "circular")
                  fwd, bwd = True, True
                  if ow in ("yes", "true", "1") or rb: bwd = False
                  elif ow == "-1": fwd = False
                  ms = None
                  try: ms = float(str(t.get("maxspeed", "")).split()[0])
                  except Exception: pass
                  for m, (sp, obey) in MODES.items():
                      v = sp.get(hw)
                      if m == "bicycle" and t.get("bicycle") == "no": v = None
                      if m == "foot" and t.get("foot") == "no": v = None
                      if m in ("car","motorcycle","truck") and t.get("motor_vehicle") == "no": v = None
                      if not v: continue
                      if ms and m in ("car","motorcycle","truck"): v = min(ms, v + 20)
                      f, b = (fwd, bwd) if obey else (True, True)
                      U, V, C = B[m]
                      for (r1, p1), (r2, p2) in zip(pts, pts[1:]):
                          XY[r1] = p1; XY[r2] = p2
                          c = hav(p1, p2) / (v / 3.6)
                          if f: U.append(r1); V.append(r2); C.append(c)
                          if b: U.append(r2); V.append(r1); C.append(c)

          H().apply_file("sl.osm.pbf", locations=True)
          for m, (sp, _) in MODES.items():
              U, V, C = (np.frombuffer(a, dtype=d) for a, d in zip(B[m], ("i8","i8","f4")))
              refs, inv = np.unique(np.concatenate([U, V]), return_inverse=True)
              u, v = inv[:len(U)].astype(np.uint32), inv[len(U):].astype(np.uint32)
              o = np.argsort(u, kind="stable"); u, v, c = u[o], v[o], C[o].astype(np.float32)
              N = len(refs)
              offs = np.zeros(N + 1, np.uint32); np.cumsum(np.bincount(u, minlength=N), out=offs[1:])
              ll = np.array([XY[int(r)] for r in refs], dtype=np.float64)
              ll = np.round(ll * 1e6).astype(np.int32)
              vmax = max(sp.values()) / 3.6
              with open(f"site/routing/{m}.bin", "wb") as f:
                  f.write(struct.pack("<IIIf", 0x52544731, N, len(v), vmax))
                  for a in (ll.ravel(), offs, v, c): f.write(a.tobytes())
              print(m, N, len(v))
          PYEOF
          python build.py
          cat > site/routing/router.js <<'JSEOF'
          // Static A* router. Usage:
          //   const r = await SLRouter.load("routing/car.bin");   // car|motorcycle|truck|bicycle|foot
          //   const res = r.route([lon1, lat1], [lon2, lat2]);    // {coords:[[lon,lat]..], meters, seconds} | null
          //   map.getSource("route").setData({type:"Feature",geometry:{type:"LineString",coordinates:res.coords}});
          const SLRouter = (() => {
            const hav = (a, b, c, d) => { const x = (c - a) * Math.PI / 180 * Math.cos((b + d) * Math.PI / 360), y = (d - b) * Math.PI / 180; return 6371000 * Math.hypot(x, y); };
            class R {
              constructor(buf) {
                const h = new DataView(buf); if (h.getUint32(0, true) !== 0x52544731) throw new Error("bad graph");
                this.N = h.getUint32(4, true); this.E = h.getUint32(8, true); this.vmax = h.getFloat32(12, true);
                let o = 16; const N = this.N, E = this.E;
                this.ll = new Int32Array(buf, o, 2 * N); o += 8 * N;
                this.offs = new Uint32Array(buf, o, N + 1); o += 4 * (N + 1);
                this.dst = new Uint32Array(buf, o, E); o += 4 * E;
                this.cost = new Float32Array(buf, o, E);
              }
              snap(lon, lat) {
                let best = -1, bd = 1e18; const ll = this.ll, k = Math.cos(lat * Math.PI / 180);
                for (let i = 0; i < this.N; i++) {
                  const dx = (ll[2 * i] / 1e6 - lon) * k, dy = ll[2 * i + 1] / 1e6 - lat, d = dx * dx + dy * dy;
                  if (d < bd) { bd = d; best = i; }
                }
                return best;
              }
              route(a, b) {
                const s = this.snap(a[0], a[1]), t = this.snap(b[0], b[1]); if (s < 0 || t < 0) return null;
                const ll = this.ll, tx = ll[2 * t] / 1e6, ty = ll[2 * t + 1] / 1e6, vm = this.vmax;
                const g = new Map([[s, 0]]), prev = new Map(), done = new Set();
                const hp = [[0, s]]; // binary min-heap of [f, node]
                const push = x => { hp.push(x); let i = hp.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (hp[p][0] <= hp[i][0]) break; [hp[p], hp[i]] = [hp[i], hp[p]]; i = p; } };
                const pop = () => { const top = hp[0], last = hp.pop(); if (hp.length) { hp[0] = last; let i = 0; for (;;) { let l = 2 * i + 1, r = l + 1, m = i; if (l < hp.length && hp[l][0] < hp[m][0]) m = l; if (r < hp.length && hp[r][0] < hp[m][0]) m = r; if (m === i) break; [hp[m], hp[i]] = [hp[i], hp[m]]; i = m; } } return top; };
                while (hp.length) {
                  const [, u] = pop(); if (done.has(u)) continue; done.add(u);
                  if (u === t) break;
                  const gu = g.get(u);
                  for (let e = this.offs[u]; e < this.offs[u + 1]; e++) {
                    const v = this.dst[e], gv = gu + this.cost[e];
                    if (gv < (g.get(v) ?? Infinity)) {
                      g.set(v, gv); prev.set(v, u);
                      push([gv + hav(ll[2 * v] / 1e6, ll[2 * v + 1] / 1e6, tx, ty) / vm, v]);
                    }
                  }
                }
                if (!done.has(t)) return null;
                const coords = []; let m = 0;
                for (let n = t; n !== undefined; n = prev.get(n)) coords.push([ll[2 * n] / 1e6, ll[2 * n + 1] / 1e6]);
                coords.reverse();
                for (let i = 1; i < coords.length; i++) m += hav(...coords[i - 1], ...coords[i]);
                return { coords, meters: m, seconds: g.get(t) };
              }
            }
            return { load: async url => new R(await (await fetch(url)).arrayBuffer()) };
          })();
          JSEOF
          # strip heredoc indentation
          sed -i 's/^          //' site/routing/router.js
          du -sh site/routing/*

      - name: Check limits
        run: |
          find site/routing -type f -size +95M -print | grep . && { echo "::error::file >95 MB"; exit 1; } || true

      - name: Save to site branch
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A && git commit -q -m "Routing graphs" || echo "Nothing to commit"
          git push -q origin HEAD:site

      - name: Save to main (/public/routing)
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git clone --depth 1 --branch "$MAIN_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mainrepo
          mkdir -p mainrepo/public && rm -rf mainrepo/public/routing
          cp -r site/routing mainrepo/public/routing
          cd mainrepo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add -A && git commit -q -m "Routing graphs" || echo "Nothing to commit"
          git push -q origin "HEAD:${MAIN_BRANCH}"

      - name: Prepare Pages artifact
        if: ${{ inputs.deploy_pages }}
        run: rsync -a --exclude .git site/ pages/
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.deploy_pages }}
        with:
          path: pages

  deploy:
    needs: build
    if: ${{ inputs.deploy_pages }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
