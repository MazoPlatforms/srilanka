name: Delete Sri Lanka routing data

# Removes what build-sri-lanka-routing.yml created:
#   site branch: /routing        main branch: /public/routing and /routes
# Then redeploys Pages without routing. Places/map data is NOT touched.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to confirm"
        default: ""
      delete_custom_routes:
        description: "Also delete /custom-routes (your own route files)"
        type: boolean
        default: false
      deploy_pages:
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  delete:
    if: ${{ inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove from site branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch site "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          cd site
          git rm -r -q --ignore-unmatch routing
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Remove routing" || echo "Nothing to remove"
          git push -q origin HEAD:site

      - name: Remove from main branch
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_BRANCH: ${{ github.event.repository.default_branch }}
          DEL_CUSTOM: ${{ inputs.delete_custom_routes }}
        run: |
          git clone --depth 1 --branch "$MAIN_BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mainrepo
          cd mainrepo
          git rm -r -q --ignore-unmatch public/routing routes
          [ "$DEL_CUSTOM" = "true" ] && git rm -r -q --ignore-unmatch custom-routes || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git commit -q -m "Remove routing data" || echo "Nothing to remove"
          git push -q origin "HEAD:${MAIN_BRANCH}"

      - name: Prepare Pages artifact
        if: ${{ inputs.deploy_pages }}
        run: rsync -a --exclude .git site/ pages/
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.deploy_pages }}
        with:
          path: pages

  deploy:
    needs: delete
    if: ${{ inputs.deploy_pages && inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
