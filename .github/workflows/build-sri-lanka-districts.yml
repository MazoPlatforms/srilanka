name: Build Sri Lanka map from OpenStreetMap and Mazo Maps places
# Main-only: rendering-zone data only, never changes routing or page UI.
on:
  workflow_dispatch:
    inputs:
      start_index:
        description: "Start rendering zone (0-24)"
        default: "0"
        required: true
      end_index:
        description: "Last rendering zone (0-24)"
        default: "24"
        required: true
      chain:
        description: "Automatically build subsequent zones"
        type: boolean
        default: true
      deploy_pages:
        description: "Deploy generated main/public after each zone"
        type: boolean
        default: true
      source_snapshot:
        description: "OSM cache version; change to refresh source data"
        default: "2026-11-09"
        required: true
permissions:
  contents: write
  actions: write
concurrency:
  group: sri-lanka-osm-publish
  cancel-in-progress: false
env:
  IDX: ${{ inputs.start_index }}
  END_INDEX: ${{ inputs.end_index }}
  SOURCE_SNAPSHOT: ${{ inputs.source_snapshot }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and install builders
        run: |
          python - <<'PY'
          import os
          a,b=int(os.environ["IDX"]),int(os.environ["END_INDEX"])
          assert 0<=a<=b<=24
          PY
          sudo apt-get update
          sudo apt-get install -y osmium-tool build-essential libsqlite3-dev zlib1g-dev
          pip install osmium==4.3.2
          git clone --depth 1 --branch 2.72.0 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          echo "/tmp/tippecanoe" >> "$GITHUB_PATH"
          python -m py_compile scripts/build_osm_map.py
      - name: Clone reviewed Mazo Maps places for build (not runtime)
        run: |
          git clone --depth 1 https://github.com/MazoPlatforms/newmaps.git /tmp/newmaps
          test -f /tmp/newmaps/scripts/place_eligibility.py
          test -d /tmp/newmaps/data/places
      - name: Cache Sri Lanka OSM PBF
        id: osm
        uses: actions/cache@v4
        with:
          path: sri-lanka.osm.pbf
          key: geofabrik-sl-${{ inputs.source_snapshot }}
      - name: Download OpenStreetMap source snapshot
        if: steps.osm.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 4 --retry-delay 8 \
            https://download.geofabrik.de/asia/sri-lanka-latest.osm.pbf -o sri-lanka.osm.pbf
          test -s sri-lanka.osm.pbf
      - name: Extract current rendering zone
        run: |
          BBOX=$(python - <<'PY'
          import os,sys
          sys.path.insert(0,"scripts")
          from build_osm_map import window
          print(",".join(map(str,window(int(os.environ["IDX"])))))
          PY
          )
          osmium extract --strategy smart -b "$BBOX" -o zone.osm.pbf sri-lanka.osm.pbf
      - name: Build OSM layers and public newmaps places
        run: |
          python scripts/build_osm_map.py --index "$IDX" --pbf zone.osm.pbf \
            --newmaps /tmp/newmaps --public public
      - name: Verify unrelated files are untouched
        run: |
          git diff --exit-code -- public/index.html public/routing.js public/data/routing
          test -s public/data/districts.json
          test -s public/index.html
          if find public -type f -size +99M -print | grep .; then
            echo "::error::Oversized file detected"
            exit 1
          fi
      - name: Commit only map data to main
        run: |
          SLUG=$(python - <<'PY'
          import os,sys
          sys.path.insert(0,"scripts")
          from build_osm_map import DISTRICTS
          print(DISTRICTS[int(os.environ["IDX"])][0])
          PY
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "public/data/districts/$SLUG" public/data/districts.json public/data/search public/data/streets
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Generate OSM map data for $SLUG"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          exit 1
      - name: Prepare current main for Pages
        if: ${{ inputs.deploy_pages }}
        run: |
          git fetch origin main
          git checkout --detach FETCH_HEAD
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.deploy_pages }}
        with:
          path: public
  deploy:
    needs: build
    if: ${{ inputs.deploy_pages }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
  next:
    needs: build
    if: ${{ inputs.chain && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Build next zone
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY: ${{ inputs.deploy_pages }}
        run: |
          NEXT=$((IDX + 1))
          if [ "$NEXT" -gt "$END_INDEX" ]; then exit 0; fi
          gh workflow run build-sri-lanka-districts.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f start_index="$NEXT" -f end_index="$END_INDEX" \
            -f chain=true -f deploy_pages="$DEPLOY" -f source_snapshot="$SOURCE_SNAPSHOT"
